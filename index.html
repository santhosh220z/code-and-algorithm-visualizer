<!doctype html>
<html lang="en" data-theme="dark-aurora">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta name="description" content="Learn algorithms step by step with synchronized code, state, and visualizations." />
    <title>AlgoViz · Algorithm Visualizer</title>
    <script>
      try {
        const stored = localStorage.getItem('algoviz:theme:v1');
        const requested = new URLSearchParams(window.location.search).get('theme');
        const themes = ['dark-aurora', 'light-editorial', 'retro-terminal', 'colorful-classroom'];
        if (themes.includes(requested)) document.documentElement.dataset.theme = requested;
        else if (themes.includes(stored)) document.documentElement.dataset.theme = stored;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
