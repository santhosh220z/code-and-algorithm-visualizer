<!doctype html>
<html lang="en" data-theme="retro-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17100a" />
    <meta name="description" content="Learn algorithms step by step with synchronized code, state, and visualizations." />
    <title>AlgoViz · Algorithm Visualizer</title>
    <script>
      // Resolve the mode before first paint so the page never flashes the wrong
      // palette. Mirrors resolveStoredTheme() in src/core/theme.ts.
      try {
        const stored = localStorage.getItem('algoviz:theme:v1');
        const themes = ['retro-light', 'retro-dark'];
        if (themes.includes(stored)) document.documentElement.dataset.theme = stored;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'retro-dark';
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
